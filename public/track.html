<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f6f5f1"><title>Track your order</title><link rel="stylesheet" href="/tracking.css"></head>
<body><main class="tracking-shell"><header class="tracking-header"><div class="tracking-brand"><span class="brand-symbol" aria-hidden="true">✦</span><span>YOUR TABLE. YOUR TIME.</span></div><span class="connection" id="connection">Connecting</span></header><div id="tracking" aria-busy="true"><section class="loading-card"><span class="eyebrow">ORDER TRACKING</span><h1>Getting your order ready…</h1><p>Checking the latest update from the restaurant.</p><div class="skeleton"></div><div class="skeleton short"></div></section></div><footer class="tracking-footer"><p id="tracking-update" role="status" aria-live="polite">Fetching order details…</p><button type="button" id="refresh-tracking">↻ Refresh status</button></footer><p class="privacy-note">This link is private to your order. Keep it handy to check progress.</p></main><script type="module" src="/tracking.js"></script></body></html>
